<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<script>
  // Ratio switch: reads ?ratio= independently of the ?only= visibility toggle below. Unknown/absent
  // values leave the className empty — base (1x1) CSS is the untouched default. (Verbatim contract
  // from templates/quote/plates.html.)
  (function () {
    var ratio = new URLSearchParams(location.search).get('ratio');
    var known = { '4x5': 1, '9x16': 1, '16x9': 1 };
    document.documentElement.className = known[ratio] ? 'ratio-' + ratio : '';
  })();
</script>
<script>
  // Ground/ink flip (SLOT-02/SLOT-04) — runs AFTER the ratio script above and uses classList.add
  // (never a className assignment), so it can never clobber the ratio script's className regardless
  // of execution order. ground=carbon (the stat default, always present in the orchestrator's query)
  // adds ground-carbon (bright number on dark); an absent/unknown/halo value adds NO class — base
  // state (dark number on light) — so the default-ground round-trip stays byte-identical.
  (function () {
    var params = new URLSearchParams(location.search);
    var g = params.get('ground');
    if (g === 'carbon') document.documentElement.classList.add('ground-carbon');
    var ink = params.get('lockupInk');
    if (ink === 'carbon' || ink === 'halo') document.documentElement.classList.add('lockup-ink-' + ink);
  })();
</script>
<title>Stat — hero-number plates</title>
<style>
  /* Local fonts (BLDR-03) — the shared Instrument Sans 500/600/700 display file (the big number) +
     Inter 400/500/600/700 body file (the support line), no CDN/network dependency. Path is relative
     to this file's own directory (templates/stat/). */
  @font-face{font-family:'Instrument Sans';font-style:normal;font-weight:500;font-display:swap;
    src:url('../../assets/fonts/instrument-sans-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Instrument Sans';font-style:normal;font-weight:600;font-display:swap;
    src:url('../../assets/fonts/instrument-sans-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Instrument Sans';font-style:normal;font-weight:700;font-display:swap;
    src:url('../../assets/fonts/instrument-sans-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;
    src:url('../../assets/fonts/inter-400-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;
    src:url('../../assets/fonts/inter-400-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;
    src:url('../../assets/fonts/inter-400-500-600-700.woff2') format('woff2');}
  :root{--flarepop-100:#ff00e5;--carbon-100:#3a3a4a;--carbon-500:#0a0a0f;--halo-100:#ffffff;
    --support-halo:#45454c;--support-carbon:#b9b9c6;
    --font-display:'Instrument Sans',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;}
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;width:1080px;height:1080px;overflow:hidden;background:transparent;}
  .frame{width:1080px;height:1080px;position:relative;overflow:hidden;background:transparent;}
  .content{position:absolute;inset:0;}
  .lockup{position:absolute;top:96px;left:96px;height:46px;aspect-ratio:4.25/1;color:var(--carbon-500);}
  .lockup svg{width:100%;height:100%;display:block;}
  /* The hero number lives in a FIXED band. The N count-up value frames are OVERLAPPING, each pinned
     to the SAME band and left-aligned, so ?only=frame-{i} isolates each value to its own full-frame
     plate at the identical typeset spot; the composite only ever shows one at a time via
     odometerAlpha. The number is INK (max legibility, Jon's hard bar); the unit affixes (prefix/
     suffix like %, x, $, M) are Flarepop colored TEXT at a smaller units size — glyph-scale, never a
     fill block. No decorative rule lines / dividers / gratuitous numbering (MEMORY). */
  .stat-hero{position:absolute;left:96px;right:96px;top:250px;height:430px;}
  .stat-frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-start;}
  .stat-line{white-space:nowrap;font-family:var(--font-display);font-weight:700;font-size:300px;
    line-height:0.92;letter-spacing:-0.04em;}
  .stat-num{color:var(--carbon-500);}
  .stat-affix{font-size:0.5em;color:var(--flarepop-100);font-weight:700;letter-spacing:-0.02em;}
  .stat-prefix{margin-right:0.02em;}
  .stat-suffix{margin-left:0.02em;}
  .support-block{position:absolute;left:96px;right:96px;top:700px;bottom:150px;}
  .support{font-family:var(--font-body);font-weight:500;font-size:44px;line-height:1.25;
    letter-spacing:-0.01em;color:var(--support-halo);margin:0;max-width:100%;}

  /* Ratio overrides — appended, base 1x1 CSS above untouched. Scoped by html.ratio-{r} (set by the
     head script from ?ratio=); higher specificity wins, so only the listed properties change. */

  /* 4x5 (1080x1350) — more vertical room; band + type grow. */
  html.ratio-4x5 body,html.ratio-4x5 .frame{width:1080px;height:1350px;}
  html.ratio-4x5 .lockup{top:104px;left:104px;height:50px;}
  html.ratio-4x5 .stat-hero{left:104px;right:104px;top:320px;height:500px;}
  html.ratio-4x5 .stat-line{font-size:340px;}
  html.ratio-4x5 .support-block{left:104px;right:104px;top:880px;bottom:180px;}
  html.ratio-4x5 .support{font-size:48px;}

  /* 9x16 (1080x1920) — portrait; the biggest display treatment, more headroom. */
  html.ratio-9x16 body,html.ratio-9x16 .frame{width:1080px;height:1920px;}
  html.ratio-9x16 .lockup{top:112px;left:104px;height:50px;}
  html.ratio-9x16 .stat-hero{left:104px;right:104px;top:520px;height:560px;}
  html.ratio-9x16 .stat-line{font-size:360px;}
  html.ratio-9x16 .support-block{left:104px;right:104px;top:1160px;bottom:280px;}
  html.ratio-9x16 .support{font-size:52px;}

  /* 16x9 (1920x1080) — wide; the number reads as a LEFT hero (band constrained to ~58% width),
     never a center-stretched square. */
  html.ratio-16x9 body,html.ratio-16x9 .frame{width:1920px;height:1080px;}
  html.ratio-16x9 .lockup{top:88px;left:112px;}
  html.ratio-16x9 .stat-hero{left:112px;right:820px;top:230px;height:400px;}
  html.ratio-16x9 .stat-line{font-size:300px;}
  html.ratio-16x9 .support-block{left:112px;right:820px;top:660px;bottom:200px;}
  html.ratio-16x9 .support{font-size:42px;}

  /* Ground ink flip + lockup override (SLOT-02/SLOT-04) — appended, base CSS above untouched.
     ground=carbon (the stat default) flips the number + support to light ink and auto-selects the
     Halo-on-Carbon lockup. The affix stays Flarepop on both grounds (colored text is brand-legal on
     carbon). lockupInk override rules come AFTER so they win a specificity tie. The lockup stays the
     canonical 8-path centered symbol throughout — CSS color swap only. */
  html.ground-carbon .stat-num{color:var(--halo-100);}
  html.ground-carbon .support{color:var(--support-carbon);}
  html.ground-carbon .lockup{color:var(--halo-100);}
  html.lockup-ink-carbon .lockup{color:var(--carbon-500);}
  html.lockup-ink-halo .lockup{color:var(--halo-100);}
</style></head>

<script>
  // Content injection (SLOT-01/SLOT-03) — reads ?content= (URL-encoded JSON; schema
  // { metric, support, ground?, lockupInk? }). ABSENT -> ZERO DOM writes, guaranteeing the no-param
  // placeholder path stays byte-identical. PRESENT -> re-derives the count-up value frames from
  // content.metric with the SAME parseMetric/countUpFrames logic src/templates/stat.cjs uses (so the
  // per-frame data-plate COUNT stays in lockstep with the odometer member count — capture isolates
  // each frame), rebuilds the N frame elements (createTextNode/appendChild only, never innerHTML),
  // fills the support line via textContent, then runs an overflow-fit pass exposing
  // window.__slotFitReport. COUNT_UP_FRAMES MUST match src/templates/stat.cjs's constant.
  (function () {
    var COUNT_UP_FRAMES = 6;

    // ---- parseMetric / countUpFrames — kept in lockstep with src/templates/stat.cjs ----
    function parseMetric(metric) {
      var s = String(metric == null ? '' : metric);
      var m = s.match(/^(\D*?)(\d[\d,]*(?:\.\d+)?)(.*)$/);
      if (!m) return null;
      var prefix = m[1], numberStr = m[2], suffix = m[3];
      var number = parseFloat(numberStr.replace(/,/g, ''));
      if (!isFinite(number)) return null;
      var dot = numberStr.indexOf('.');
      var decimals = dot < 0 ? 0 : (numberStr.length - dot - 1);
      return { prefix: prefix, numberStr: numberStr, number: number, decimals: decimals, suffix: suffix };
    }
    function countUpFrames(parsed, K) {
      var frames = [];
      for (var i = 1; i <= K; i++) {
        var value = (i === K) ? parsed.numberStr : (parsed.number * i / K).toFixed(parsed.decimals);
        frames.push({ prefix: parsed.prefix, value: value, suffix: parsed.suffix });
      }
      return frames;
    }

    // Build one <div class="stat-frame" data-plate="frame-{i}"><span class="stat-line">...</span></div>
    // with an optional Flarepop prefix, the ink number, and an optional Flarepop suffix.
    function buildFrame(f, i) {
      var frame = document.createElement('div');
      frame.className = 'stat-frame';
      frame.setAttribute('data-plate', 'frame-' + i);
      var line = document.createElement('span');
      line.className = 'stat-line';
      if (f.prefix) {
        var pre = document.createElement('span');
        pre.className = 'stat-affix stat-prefix';
        pre.appendChild(document.createTextNode(f.prefix));
        line.appendChild(pre);
      }
      var num = document.createElement('span');
      num.className = 'stat-num';
      num.appendChild(document.createTextNode(f.value));
      line.appendChild(num);
      if (f.suffix) {
        var suf = document.createElement('span');
        suf.className = 'stat-affix stat-suffix';
        suf.appendChild(document.createTextNode(f.suffix));
        line.appendChild(suf);
      }
      frame.appendChild(line);
      return frame;
    }

    var raw = new URLSearchParams(location.search).get('content');
    if (!raw) return; // additive-optional: default (no-content) capture path is completely untouched
    var content;
    try { content = JSON.parse(decodeURIComponent(raw)); } catch (e) { return; }
    if (!content || typeof content !== 'object') return;

    // setText (Phase 14 universal LINE-RETURNS) — \n -> <br> for the plain-text support slot. No \n =>
    // el.textContent = str, BYTE-IDENTICAL to the previous assignment.
    function setText(el, str) {
      str = String(str);
      // Returns the per-\n-line text nodes (for the optional per-line color pass). The no-\n branch is
      // BYTE-IDENTICAL to the previous `el.textContent = str` assignment.
      if (str.indexOf('\n') === -1) { el.textContent = str; return [el.firstChild]; }
      while (el.firstChild) el.removeChild(el.firstChild);
      var nodes = [];
      str.split('\n').forEach(function (line, i) {
        if (i > 0) el.appendChild(document.createElement('br'));
        var tn = document.createTextNode(line);
        el.appendChild(tn);
        nodes.push(tn);
      });
      return nodes;
    }
    // applyTextControls (Phase 14 per-slot COLOR + SIZE) — content.colors[slot] is a resolved brand hex
    // (no hex literal in this file); content.sizeScales[slot] multiplies each target's BASE font-size,
    // applied BEFORE runFit so size is a TARGET and the overflow auto-fit stays the safety clamp.
    // Absent => ZERO writes => byte-identical.
    function applyTextControls(map) {
      var colors = content.colors, sizes = content.sizeScales;
      // colorLine — color ONE \n-line. An Element (a word span / the Flarepop accent span) is colored
      // directly (an inline color beats the class, so a per-line color OVERRIDES the auto-accent); a bare
      // text node is wrapped in a fresh inline <span> so only that line is colored. No layout change, so
      // the overflow-fit pass (which measures the original text nodes) is unaffected.
      function colorLine(node, hex) {
        if (!node || !hex) return;
        if (node.nodeType === 1) { node.style.color = hex; return; }
        var parent = node.parentNode; if (!parent) return;
        var span = document.createElement('span');
        parent.insertBefore(span, node);
        span.appendChild(node);
        span.style.color = hex;
      }
      Object.keys(map).forEach(function (slot) {
        var t = map[slot];
        var c = colors ? colors[slot] : null;
        if (Array.isArray(c)) {
          // PER-LINE color (Phase 14 v1.2): c is an array of resolved brand hexes, ONE PER \n-line
          // (index 0 = first line). A shorter array / null entry leaves that line at its slot/template
          // default. Applied to every instance this slot rendered (e.g. each carousel beat). A line entry
          // may be a single node OR an array of nodes (e.g. a quote line's word spans).
          (t.lines || []).forEach(function (instance) {
            (instance || []).forEach(function (lineEntry, i) {
              var hex = c[i]; if (!hex) return;
              (Array.isArray(lineEntry) ? lineEntry : [lineEntry]).forEach(function (n) { colorLine(n, hex); });
            });
          });
        } else if (typeof c === 'string' && c) {
          (t.color || []).forEach(function (el) { if (el) el.style.color = c; });
        }
        if (sizes && typeof sizes[slot] === 'number' && isFinite(sizes[slot]) && sizes[slot] !== 1) {
          (t.size || []).forEach(function (el) {
            if (!el) return;
            var base = parseFloat(getComputedStyle(el).fontSize);
            if (isFinite(base)) el.style.fontSize = (base * sizes[slot]) + 'px';
          });
        }
      });
    }

    // ---- rebuild the value frames from content.metric ----
    if (content.metric != null) {
      var hero = document.querySelector('.stat-hero');
      while (hero.firstChild) hero.removeChild(hero.firstChild);
      var parsed = parseMetric(content.metric);
      var frames = parsed
        ? countUpFrames(parsed, COUNT_UP_FRAMES)
        : [{ prefix: '', value: String(content.metric), suffix: '' }];
      frames.forEach(function (f, idx) { hero.appendChild(buildFrame(f, idx + 1)); });
    }
    var supportEl = document.querySelector('[data-plate="support"]');
    var supportLineNodes = content.support != null ? setText(supportEl, content.support) : null;

    // metric -> COLOR the number ink (.stat-num; the Flarepop affix keeps its own rule), SIZE the whole
    // .stat-line (num + affix together, matching how runFit scales the shared line). support -> its own
    // element, with `lines` = its authored \n-lines so a per-line colors array colors each support line
    // independently. Applied before runFit so size is a target and fit clamps.
    applyTextControls({
      metric: {
        color: [].slice.call(document.querySelectorAll('.stat-frame .stat-num')),
        size: [].slice.call(document.querySelectorAll('.stat-frame .stat-line')),
      },
      support: { color: [supportEl], size: [supportEl], lines: supportLineNodes ? [supportLineNodes] : [] },
    });

    // ---- overflow fit (SLOT-01): scale-down-then-wrap, WRITE-FREE WHEN IT ALREADY FITS. The hero
    // number is measured on the FINAL frame (frame-N, the reference); the resulting font-size is
    // applied to EVERY overlapping frame so they share one scale (they must typeset identically). The
    // support line is allowed to wrap and scaled until it fits its block on both axes. Never clips
    // (no overflow:hidden on a text slot) — correctness is asserted by verify-stat.cjs, not hidden.
    // Deferred on document.fonts.ready so measurement uses the real Instrument Sans/Inter metrics
    // (plate-capture.cjs / verify-stat.cjs await the same promise before screenshotting/reading, and
    // this handler registers first, so it always runs before their continuation — the quote pattern).
    var SCALE_STEP = 0.05, NUM_FLOOR = 0.4, LINE_FLOOR = 0.55;

    function rectToPlain(r) {
      return { x: r.x, y: r.y, width: r.width, height: r.height, left: r.left, top: r.top, right: r.right, bottom: r.bottom };
    }

    function runFit() {
      var report = {};
      var hero = document.querySelector('.stat-hero');
      var lines = [].slice.call(document.querySelectorAll('.stat-frame .stat-line'));
      var frameEls = [].slice.call(document.querySelectorAll('.stat-frame'));
      var refFrame = document.querySelector('[data-plate="frame-' + frameEls.length + '"]') || frameEls[frameEls.length - 1];
      var refLine = refFrame ? refFrame.querySelector('.stat-line') : null;

      var availW = hero.clientWidth, availH = hero.clientHeight;
      var nScale = 1;
      if (refLine) {
        var baseN = parseFloat(getComputedStyle(refLine).fontSize);
        var fitsAtBase = refLine.scrollWidth <= availW + 1 && refLine.scrollHeight <= availH + 1;
        if (!fitsAtBase) {
          for (var s = 0.95; s >= NUM_FLOOR - 1e-9; s -= SCALE_STEP) {
            var px = baseN * s;
            lines.forEach(function (ln) { ln.style.fontSize = px + 'px'; });
            nScale = s;
            if (refLine.scrollWidth <= availW + 1 && refLine.scrollHeight <= availH + 1) break;
          }
        }
        report.number = { scale: nScale, rect: rectToPlain(refLine.getBoundingClientRect()) };
      }

      // Support: body text, allowed to wrap; scale down until it fits its block on both axes.
      var support = document.querySelector('[data-plate="support"]');
      var block = document.querySelector('.support-block');
      var availSW = block.clientWidth, availSH = block.clientHeight;
      var baseS = parseFloat(getComputedStyle(support).fontSize);
      var sScale = 1;
      var supFits = support.scrollWidth <= availSW + 1 && support.scrollHeight <= availSH + 1;
      if (!supFits) {
        for (var ss = 0.95; ss >= LINE_FLOOR - 1e-9; ss -= SCALE_STEP) {
          support.style.fontSize = (baseS * ss) + 'px';
          sScale = ss;
          if (support.scrollWidth <= availSW + 1 && support.scrollHeight <= availSH + 1) break;
        }
      }
      report.support = { scale: sScale, rect: rectToPlain(support.getBoundingClientRect()) };

      window.__slotFitReport = report;
    }

    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(runFit);
    } else {
      runFit();
    }
  })();
</script>
<script>
  const only=new URLSearchParams(location.search).get('only');
  if(only){for(const el of document.querySelectorAll('[data-plate]')){el.style.visibility=(el.getAttribute('data-plate')===only)?'visible':'hidden';}}
</script>
</body></html>
