<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<script>
  // Ratio switch: reads ?ratio= independently of the existing ?only= visibility toggle below.
  // Unknown/absent values leave the className empty — base (1x1) CSS is the untouched default.
  (function () {
    var ratio = new URLSearchParams(location.search).get('ratio');
    var known = { '4x5': 1, '9x16': 1, '16x9': 1 };
    document.documentElement.className = known[ratio] ? 'ratio-' + ratio : '';
  })();
</script>
<script>
  // Ground/ink flip (Phase 5, SLOT-02/SLOT-04) — runs AFTER the ratio script above and uses
  // classList.add (never a className assignment), so it can never clobber (or be clobbered by)
  // the ratio script's className assignment regardless of execution order. ground=halo (the
  // new-hire default, always present in the orchestrator's query) or an absent/unknown value
  // adds NO class — base state — so the default-ground round-trip stays byte-identical.
  (function () {
    var params = new URLSearchParams(location.search);
    var g = params.get('ground');
    if (g === 'carbon') document.documentElement.classList.add('ground-carbon');
    var ink = params.get('lockupInk');
    if (ink === 'carbon' || ink === 'halo') document.documentElement.classList.add('lockup-ink-' + ink);
  })();
</script>
<title>New Hire — square plates</title>
<style>
  /* Local fonts (BLDR-03) — the exact Google-served woff2 for this template's original CDN
     request (Instrument Sans 500/600/700 + Inter 400/500/600/700, one shared variable-range file
     per family), embedded with no CDN/network dependency. Path is relative to this file's own
     directory (templates/new-hire/), which is how plate-capture.cjs's file:// load resolves it. */
  @font-face{font-family:'Instrument Sans';font-style:normal;font-weight:500;font-display:swap;
    src:url('../../assets/fonts/instrument-sans-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Instrument Sans';font-style:normal;font-weight:600;font-display:swap;
    src:url('../../assets/fonts/instrument-sans-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Instrument Sans';font-style:normal;font-weight:700;font-display:swap;
    src:url('../../assets/fonts/instrument-sans-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;
    src:url('../../assets/fonts/inter-400-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;
    src:url('../../assets/fonts/inter-400-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;
    src:url('../../assets/fonts/inter-400-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;
    src:url('../../assets/fonts/inter-400-500-600-700.woff2') format('woff2');}
  :root{--flarepop-100:#ff00e5;--carbon-100:#3a3a4a;--carbon-500:#0a0a0f;
    --font-display:'Instrument Sans',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;}
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;width:1080px;height:1080px;overflow:hidden;background:transparent;}
  .frame{width:1080px;height:1080px;position:relative;overflow:hidden;background:transparent;}
  .hero{position:absolute;bottom:0;right:4px;height:788px;width:auto;z-index:1;display:block;}
  .content{position:absolute;inset:0;padding:72px;z-index:2;display:flex;flex-direction:column;height:100%;}
  .lockup{height:46px;aspect-ratio:4.25/1;align-self:flex-start;color:var(--carbon-500);}
  .lockup svg{width:100%;height:100%;display:block;}
  .greeting{font-family:var(--font-display);font-weight:700;font-size:84px;line-height:0.98;
    letter-spacing:-0.035em;color:var(--carbon-500);margin:58px 0 0;}
  .greeting .gl{display:block;}
  .name{font-family:var(--font-display);font-weight:700;font-size:54px;line-height:1.0;
    letter-spacing:-0.03em;color:var(--flarepop-100);margin:30px 0 0;}
  .role{font-family:var(--font-body);font-weight:500;font-size:28px;line-height:1.3;
    color:var(--carbon-100);margin:14px 0 0;max-width:460px;}

  /* Ratio overrides (Phase 4, RATIO-02/03/04) — appended, base 1x1 CSS above is untouched.
     Scoped by html.ratio-{r} (set by the head script above from ?ratio=); higher selector
     specificity than the base rules wins, so only the listed properties change per ratio. */

  /* 4x5 (1080x1350) — ported verbatim from the shipped new-hire-jeff-lewis/plates.html */
  html.ratio-4x5 body,html.ratio-4x5 .frame{width:1080px;height:1350px;}
  html.ratio-4x5 .hero{height:918px;}
  html.ratio-4x5 .content{padding:76px;}
  html.ratio-4x5 .lockup{height:50px;}
  html.ratio-4x5 .greeting{font-size:100px;margin:84px 0 0;}
  html.ratio-4x5 .name{font-size:66px;margin:40px 0 0;}
  html.ratio-4x5 .role{font-size:32px;max-width:520px;margin:18px 0 0;}

  /* 9x16 (1080x1920) — portrait stack intensifies: more headroom, bottom-anchored hero */
  html.ratio-9x16 body,html.ratio-9x16 .frame{width:1080px;height:1920px;}
  html.ratio-9x16 .hero{height:1040px;}
  html.ratio-9x16 .content{padding:76px;}
  html.ratio-9x16 .lockup{height:50px;}
  html.ratio-9x16 .greeting{font-size:112px;margin:96px 0 0;}
  html.ratio-9x16 .name{font-size:70px;margin:44px 0 0;}
  html.ratio-9x16 .role{font-size:34px;max-width:560px;margin:20px 0 0;}

  /* 16x9 (1920x1080) — horizontal split: copy column left, hero right-anchored, never stretched */
  html.ratio-16x9 body,html.ratio-16x9 .frame{width:1920px;height:1080px;}
  html.ratio-16x9 .hero{right:64px;height:1000px;}
  html.ratio-16x9 .content{padding:72px;right:auto;width:52%;}
  html.ratio-16x9 .greeting{font-size:88px;}
  html.ratio-16x9 .name{font-size:56px;}
  html.ratio-16x9 .role{font-size:30px;}

  /* Ground ink flip + lockup override (Phase 5, SLOT-02/SLOT-04) — appended, base CSS above
     untouched. ground=halo (default, no class added) keeps the current Carbon-on-Halo copy +
     lockup untouched. html.ground-carbon flips copy to light ink and auto-selects the
     Halo-on-Carbon lockup. .name stays Flarepop on both grounds (colored text is brand-legal on
     carbon — the shipped dark-variant treatment). lockupInk override rules are appended AFTER
     the ground rules so they win at equal specificity. The lockup stays the canonical 8-path
     centered symbol throughout — this is a CSS color swap only, zero path/markup changes. */
  :root{--halo-100:#ffffff;}
  html.ground-carbon .greeting{color:var(--halo-100);}
  html.ground-carbon .role{color:#b9b9c6;}
  html.ground-carbon .lockup{color:var(--halo-100);}
  html.lockup-ink-carbon .lockup{color:var(--carbon-500);}
  html.lockup-ink-halo .lockup{color:var(--halo-100);}
</style></head>

<div class="frame">
  <img class="hero" data-plate="photo" src="assets/photo-placeholder.png" alt="Jeff Lewis">
  <div class="content">
    <div class="lockup" data-plate="lockup"><svg><use href="#intercept-lockup-centered"/></svg></div>
    <h1 class="greeting"><span class="gl" data-plate="greeting-1">Welcome to</span><span class="gl" data-plate="greeting-2">the team.</span></h1>
    <p class="name" data-plate="name">Jeff&nbsp;Lewis</p>
    <p class="role" data-plate="role">Head of Client Advisory</p>
  </div>
</div>
<script>
  // Content injection (Phase 5, SLOT-01/SLOT-03) — reads ?content= (URL-encoded JSON; schema
  // documented in scripts/capture-content-plates.cjs). ABSENT -> ZERO DOM writes, guaranteeing
  // the no-param placeholder path stays byte-identical. PRESENT -> fills only the fields the
  // payload carries (omitted fields keep placeholder markup); textContent only, never innerHTML,
  // so copy is transcribed verbatim with no markup interpretation.
  (function () {
    var raw = new URLSearchParams(location.search).get('content');
    if (!raw) return;
    var content = JSON.parse(decodeURIComponent(raw));

    // setText (Phase 14, universal LINE-RETURNS) — honor an explicit \n as a hard line break
    // (\n -> <br>). No \n => el.textContent = str, BYTE-IDENTICAL to the previous assignment (the
    // default copy has no \n, so the round-trip stays byte-identical). createTextNode/<br> only,
    // never innerHTML (copy transcribed verbatim).
    function setText(el, str) {
      str = String(str);
      // Returns the per-\n-line text nodes (for the optional per-line color pass). The no-\n branch is
      // BYTE-IDENTICAL to the previous `el.textContent = str` assignment.
      if (str.indexOf('\n') === -1) { el.textContent = str; return [el.firstChild]; }
      while (el.firstChild) el.removeChild(el.firstChild);
      var nodes = [];
      str.split('\n').forEach(function (line, i) {
        if (i > 0) el.appendChild(document.createElement('br'));
        var tn = document.createTextNode(line);
        el.appendChild(tn);
        nodes.push(tn);
      });
      return nodes;
    }
    // applyTextControls (Phase 14, per-slot COLOR + SIZE) — content.colors[slot] is a resolved brand
    // hex (capture-content-plates.cjs resolves the palette token->hex via src/text-palette.cjs, so no
    // hex literal lives in this file). content.sizeScales[slot] multiplies the slot's BASE font-size.
    // Applied BEFORE the fit pass so size is a TARGET and the existing overflow auto-fit stays the
    // safety clamp. Absent map/keys => ZERO writes => byte-identical.
    function applyTextControls(map) {
      var colors = content.colors, sizes = content.sizeScales;
      // colorLine — color ONE \n-line. An Element (a word span / a greeting display line) is colored
      // directly (an inline color beats the class); a bare text node is wrapped in a fresh inline <span>
      // so only that line is colored. No layout change, so the overflow-fit pass (which measures the
      // original text nodes) is unaffected.
      function colorLine(node, hex) {
        if (!node || !hex) return;
        if (node.nodeType === 1) { node.style.color = hex; return; }
        var parent = node.parentNode; if (!parent) return;
        var span = document.createElement('span');
        parent.insertBefore(span, node);
        span.appendChild(node);
        span.style.color = hex;
      }
      Object.keys(map).forEach(function (slot) {
        var t = map[slot];
        var c = colors ? colors[slot] : null;
        if (Array.isArray(c)) {
          // PER-LINE color (Phase 14 v1.2): c is an array of resolved brand hexes, ONE PER \n-line
          // (index 0 = first line). A shorter array / null entry leaves that line at its slot/template
          // default. Applied to every instance this slot rendered. A line entry may be a single node OR
          // an array of nodes.
          (t.lines || []).forEach(function (instance) {
            (instance || []).forEach(function (lineEntry, i) {
              var hex = c[i]; if (!hex) return;
              (Array.isArray(lineEntry) ? lineEntry : [lineEntry]).forEach(function (n) { colorLine(n, hex); });
            });
          });
        } else if (typeof c === 'string' && c) {
          (t.color || []).forEach(function (el) { if (el) el.style.color = c; });
        }
        if (sizes && typeof sizes[slot] === 'number' && isFinite(sizes[slot]) && sizes[slot] !== 1) {
          (t.size || []).forEach(function (el) {
            if (!el) return;
            var base = parseFloat(getComputedStyle(el).fontSize);
            if (isFinite(base)) el.style.fontSize = (base * sizes[slot]) + 'px';
          });
        }
      });
    }

    var g1El = document.querySelector('[data-plate="greeting-1"]');
    var g2El = document.querySelector('[data-plate="greeting-2"]');
    var nameEl = document.querySelector('[data-plate="name"]');
    var roleEl = document.querySelector('[data-plate="role"]');
    if (Array.isArray(content.greeting)) {
      if (content.greeting[0] != null) setText(g1El, content.greeting[0]);
      if (content.greeting[1] != null) setText(g2El, content.greeting[1]);
    }
    var nameLineNodes = content.name != null ? setText(nameEl, content.name) : null;
    var roleLineNodes = content.role != null ? setText(roleEl, content.role) : null;
    if (content.photo) document.querySelector('[data-plate="photo"]').src = content.photo;

    // greeting -> both display lines; name/role -> their own element. `lines` lets a per-line colors
    // array color each line independently: greeting line 0 = g1El, line 1 = g2El (its two display lines);
    // name/role by their authored \n-lines. Applied before fit() below.
    applyTextControls({
      greeting: { color: [g1El, g2El], size: [g1El, g2El], lines: [[g1El, g2El]] },
      name: { color: [nameEl], size: [nameEl], lines: nameLineNodes ? [nameLineNodes] : [] },
      role: { color: [roleEl], size: [roleEl], lines: roleLineNodes ? [roleLineNodes] : [] },
    });

    // Scale-down-then-wrap overflow fit (SLOT-01) — runs ONLY inside this content!=null branch,
    // so the no-param path is entirely unaffected. WRITE-FREE WHEN NOT ENGAGED: a slot already
    // fitting at its base font-size receives zero style mutations (checked below via the
    // `scale[name] > floor` guards never firing), which is what keeps the default-spec
    // round-trip (content present, but content === defaults) byte-identical to the committed
    // placeholder plates even with this pass live.
    (function fit() {
      var frame = document.querySelector('.frame');
      var contentEl = document.querySelector('.content');
      var slotNames = ['greeting-1', 'greeting-2', 'name', 'role'];
      var els = {}, baseSize = {}, scale = {};
      slotNames.forEach(function (name) {
        var el = document.querySelector('[data-plate="' + name + '"]');
        els[name] = el;
        baseSize[name] = parseFloat(getComputedStyle(el).fontSize);
        scale[name] = 1;
      });

      var contentRect = contentEl.getBoundingClientRect();
      var contentStyle = getComputedStyle(contentEl);
      var paddingLeft = parseFloat(contentStyle.paddingLeft) || 0;
      var paddingRight = parseFloat(contentStyle.paddingRight) || 0;
      var paddingBottom = parseFloat(contentStyle.paddingBottom) || 0;
      var columnWidth = contentRect.width - paddingLeft - paddingRight;

      function boxWidth(el) {
        var maxW = parseFloat(getComputedStyle(el).maxWidth);
        return (!isNaN(maxW) && maxW < columnWidth) ? maxW : columnWidth;
      }

      function singleLineWidth(el) {
        var prevInline = el.style.whiteSpace;
        el.style.whiteSpace = 'nowrap';
        var w = el.scrollWidth;
        if (prevInline) { el.style.whiteSpace = prevInline; } else { el.style.removeProperty('white-space'); }
        return w;
      }

      function applyScale(name) {
        els[name].style.fontSize = (baseSize[name] * scale[name]) + 'px';
      }

      // Phase A: per-slot single-line scale-down, 5% steps, floor 65% of base — prefer keeping
      // the shipped line structure before accepting wraps.
      var FLOOR_A = 0.65;
      slotNames.forEach(function (name) {
        var el = els[name];
        var box = boxWidth(el);
        while (singleLineWidth(el) > box && scale[name] > FLOOR_A + 1e-9) {
          scale[name] = Math.max(FLOOR_A, +(scale[name] - 0.05).toFixed(4));
          applyScale(name);
        }
      });

      // Phase B: at each slot's floor, natural wrapping is already allowed (block elements, no
      // white-space:nowrap left set). If the resulting stack still overflows the frame
      // vertically (role — the last stacked slot — extends past the available bottom edge),
      // step every slot down together to a hard floor of 50%. Never clip: no overflow:hidden is
      // ever set on a text slot; correctness is asserted (verify script), not hidden.
      var FLOOR_B = 0.50;
      function stackOverflows() {
        var frameRect = frame.getBoundingClientRect();
        var roleRect = els.role.getBoundingClientRect();
        return roleRect.bottom > (frameRect.bottom - paddingBottom);
      }
      var guard = 0;
      while (stackOverflows() && guard < 20) {
        var steppedAny = false;
        slotNames.forEach(function (name) {
          if (scale[name] > FLOOR_B + 1e-9) {
            scale[name] = Math.max(FLOOR_B, +(scale[name] - 0.05).toFixed(4));
            applyScale(name);
            steppedAny = true;
          }
        });
        if (!steppedAny) break;
        guard++;
      }

      window.__slotFitReport = {};
      slotNames.forEach(function (name) {
        var r = els[name].getBoundingClientRect();
        window.__slotFitReport[name] = { scale: scale[name], rect: { x: r.x, y: r.y, w: r.width, h: r.height } };
      });
    })();
  })();
</script>
<script>
  const only=new URLSearchParams(location.search).get('only');
  if(only){for(const el of document.querySelectorAll('[data-plate]')){el.style.visibility=(el.getAttribute('data-plate')===only)?'visible':'hidden';}}
</script>
