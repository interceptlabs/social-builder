<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Hot-take — plates</title>
<script>
  // Ratio reflow switch (RATIO-02..05): read ?ratio= and set html.ratio-{r} for the three
  // non-default ratios; unknown/absent values leave the class unset (base 1x1 layout, untouched).
  const __ratio = new URLSearchParams(location.search).get('ratio');
  const __knownRatios = ['4x5', '9x16', '16x9'];
  if (__ratio && __knownRatios.includes(__ratio)) document.documentElement.classList.add('ratio-' + __ratio);
</script>
<script>
  // Ground/ink switch (SLOT-02/04): ?ground=halo auto-selects Carbon-on-Halo ink; carbon/absent/
  // unknown adds NO class (the hot-take's base ground is carbon / Halo-on-Carbon, so this keeps the
  // default round-trip byte-identical). ?lockupInk explicitly overrides the lockup's ink regardless
  // of ground. Naming mirrors the ground-{v}/lockup-ink-{v} convention used across templates. Uses
  // classList.add (never a className assignment) so this can never clobber the ratio script above.
  const __ground = new URLSearchParams(location.search).get('ground');
  if (__ground === 'halo') document.documentElement.classList.add('ground-halo');
  const __lockupInk = new URLSearchParams(location.search).get('lockupInk');
  if (__lockupInk === 'carbon' || __lockupInk === 'halo') document.documentElement.classList.add('lockup-ink-' + __lockupInk);
</script>
<style>
  /* Local font (BLDR-03, no CDN) — the punchy display weight for the statement is Instrument Sans
     700, embedded from the exact Google-served single-weight woff2 (instrument-sans-700-solo.woff2,
     the same bytes the carousel template uses). Path is relative to this file's own directory
     (templates/hot-take/), which is how plate-capture.cjs's file:// load resolves it. */
  @font-face{font-family:'Instrument Sans';font-style:normal;font-weight:700;font-display:swap;
    src:url('../../assets/fonts/instrument-sans-700-solo.woff2') format('woff2');}
  :root{--flarepop-100:#ff00e5;--halo-100:#ffffff;--carbon-500:#0a0a0f;--carbon-100:#3a3a4a;
    --font-display:'Instrument Sans',system-ui,sans-serif;}
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;width:1080px;height:1080px;overflow:hidden;background:transparent;}
  .frame{width:1080px;height:1080px;position:relative;overflow:hidden;background:transparent;}
  .lockup{position:absolute;top:80px;left:80px;height:56px;aspect-ratio:4.25/1;color:var(--halo-100);}
  .lockup svg{width:100%;height:100%;display:block;}
  /* The statement is a FULL-FRAME plate (inset:0), vertically centered, left-aligned (the established
     Fritz pull-quote convention). In v2 the statement is ALWAYS composed unclipped at full opacity —
     the apex-up triangle SWEEP accent is drawn by the composer primitive as an UNDERLAY BEHIND this
     plate (not a clip of it), so the type is never fragmented and stays fully legible. */
  .statement{position:absolute;inset:0;padding:80px;display:flex;align-items:center;}
  .stmt{font-family:var(--font-display);font-weight:700;font-size:128px;line-height:1.05;
    letter-spacing:-0.03em;color:var(--halo-100);margin:0;}
  .stmt .accent{color:var(--flarepop-100);}

  /* Ratio-scoped reflow blocks — append-only, base 1x1 rules above stay untouched. */
  html.ratio-4x5 body,html.ratio-4x5 .frame{width:1080px;height:1350px;}
  html.ratio-4x5 .lockup{top:88px;left:88px;}
  html.ratio-4x5 .statement{padding:88px;}
  html.ratio-4x5 .stmt{font-size:136px;}

  /* 9x16: same centered-statement composition, taller frame — breathing room above/below the
     statement IS the design (flex align-items:center already centers on the cross axis at any
     frame height); type is not stretched to fill the extra height. */
  html.ratio-9x16 body,html.ratio-9x16 .frame{width:1080px;height:1920px;}
  html.ratio-9x16 .lockup{top:96px;left:88px;}
  html.ratio-9x16 .statement{padding:88px;}
  html.ratio-9x16 .stmt{font-size:136px;line-height:1.06;}

  /* 16x9: composition re-sets as a left-aligned statement (never a center-stretched square) —
     .statement's default flex justify-content (flex-start) already left-aligns; constrain .stmt to
     ~64% width so the line rewraps for the wide frame instead of stretching edge-to-edge. */
  html.ratio-16x9 body,html.ratio-16x9 .frame{width:1920px;height:1080px;}
  html.ratio-16x9 .lockup{top:80px;left:96px;}
  html.ratio-16x9 .statement{padding:96px;}
  html.ratio-16x9 .stmt{font-size:128px;max-width:64%;}

  /* Ground ink flip + lockup ink override (SLOT-02/04) — appended, base rules above untouched.
     ground=halo auto-selects Carbon-on-Halo (no class for carbon/absent/unknown keeps the default
     round-trip byte-identical); lockupInk explicitly overrides either way — ink rules come AFTER the
     ground rule so an explicit lockupInk always wins a specificity tie. .stmt .accent keeps its own
     untouched rule (Flarepop, colored text only, both grounds). */
  html.ground-halo .stmt{color:var(--carbon-500);}
  html.ground-halo .lockup{color:var(--carbon-500);}
  html.lockup-ink-carbon .lockup{color:var(--carbon-500);}
  html.lockup-ink-halo .lockup{color:var(--halo-100);}
</style></head>

  <div class="statement" data-plate="statement"><p class="stmt">Off-brand<br><span class="accent">is expensive.</span></p></div>

<script>
  // Statement injection + accent contract + overflow fit (SLOT-01/02/04). No ?content= -> zero DOM
  // writes; the committed static markup renders exactly as before. With content present, the
  // statement string (which may contain \n for a 2nd line) is rebuilt via createTextNode/<br> only
  // (never innerHTML — copy is transcribed verbatim), then an overflow-fit pass runs (write-free when
  // it already fits) exposing window.__slotFitReport. capture-content-plates.cjs ALWAYS passes
  // content=, so the default spec routes through this exact rebuild — the \n-structured default
  // statement is precisely what this reproduces byte-identically against the committed static markup.
  (function () {
    var raw = new URLSearchParams(location.search).get('content');
    if (!raw) return; // additive-optional: default (no-content) capture path is completely untouched
    var content;
    try { content = JSON.parse(decodeURIComponent(raw)); } catch (e) { return; }
    if (!content || content.statement == null) return;

    // applyTextControls (Phase 14 per-slot COLOR + SIZE) — content.colors[slot] is a resolved brand hex
    // (no hex literal in this file); content.sizeScales[slot] multiplies the slot's BASE font-size,
    // applied BEFORE runFit so size is a TARGET and the overflow auto-fit stays the safety clamp. The
    // .accent span keeps its own Flarepop rule. Absent => ZERO writes => byte-identical.
    function applyTextControls(map) {
      var colors = content.colors, sizes = content.sizeScales;
      // colorLine — color ONE \n-line. An Element (a word span / the Flarepop accent span) is colored
      // directly (an inline color beats the class, so a per-line color OVERRIDES the auto-accent); a bare
      // text node is wrapped in a fresh inline <span> so only that line is colored. No layout change, so
      // the overflow-fit pass (which measures the original text nodes) is unaffected.
      function colorLine(node, hex) {
        if (!node || !hex) return;
        if (node.nodeType === 1) { node.style.color = hex; return; }
        var parent = node.parentNode; if (!parent) return;
        var span = document.createElement('span');
        parent.insertBefore(span, node);
        span.appendChild(node);
        span.style.color = hex;
      }
      Object.keys(map).forEach(function (slot) {
        var t = map[slot];
        var c = colors ? colors[slot] : null;
        if (Array.isArray(c)) {
          // PER-LINE color (Phase 14 v1.2): c is an array of resolved brand hexes, ONE PER \n-line
          // (index 0 = first line). A shorter array / null entry leaves that line at its slot/template
          // default. Applied to every instance this slot rendered (e.g. each carousel beat). A line entry
          // may be a single node OR an array of nodes (e.g. a quote line's word spans).
          (t.lines || []).forEach(function (instance) {
            (instance || []).forEach(function (lineEntry, i) {
              var hex = c[i]; if (!hex) return;
              (Array.isArray(lineEntry) ? lineEntry : [lineEntry]).forEach(function (n) { colorLine(n, hex); });
            });
          });
        } else if (typeof c === 'string' && c) {
          (t.color || []).forEach(function (el) { if (el) el.style.color = c; });
        }
        if (sizes && typeof sizes[slot] === 'number' && isFinite(sizes[slot]) && sizes[slot] !== 1) {
          (t.size || []).forEach(function (el) {
            if (!el) return;
            var base = parseFloat(getComputedStyle(el).fontSize);
            if (isFinite(base)) el.style.fontSize = (base * sizes[slot]) + 'px';
          });
        }
      });
    }

    // ---- accent contract: split the statement on \n; the FINAL \n-line -> span.accent (Flarepop)
    // unless {text, accent:false}. A single-line statement (no \n) is its own final line, so it gets
    // the accent treatment unless opted out. This mirrors the carousel injector's contract.
    function buildStmt(entry) {
      var isObj = entry && typeof entry === 'object';
      var text = isObj ? entry.text : entry;
      var accentOn = !(isObj && entry.accent === false);
      var lines = String(text).split('\n');
      var p = document.createElement('p');
      p.className = 'stmt';
      var lineNodes = []; // one text node per authored line, kept for the fit pass below
      lines.forEach(function (line, i) {
        var isLast = i === lines.length - 1;
        var tn = document.createTextNode(line);
        if (isLast && accentOn) {
          var span = document.createElement('span');
          span.className = 'accent';
          span.appendChild(tn);
          p.appendChild(span);
        } else {
          p.appendChild(tn);
        }
        lineNodes.push(tn);
        if (!isLast) p.appendChild(document.createElement('br'));
      });
      return { el: p, lineNodes: lineNodes };
    }

    var container = document.querySelector('.statement[data-plate="statement"]');
    var old = container.querySelector('.stmt');
    if (old) old.remove();
    var stmt = buildStmt(content.statement);
    container.appendChild(stmt.el);

    var built = [{ plate: 'statement', containerEl: container, stmt: stmt }];

    // statement -> the .stmt block (non-accent text). `lines` = the authored \n-lines (one text node
    // each) so a per-line colors array can color each line independently. Applied before runFit so size
    // is a target.
    applyTextControls({ statement: { color: [stmt.el], size: [stmt.el], lines: [stmt.lineNodes] } });

    // ---- overflow fit: scale-down in 5% steps to a 65% floor while preserving the authored line
    // structure (no extra wrap), then allow natural wrap while continuing to scale down to a hard 50%
    // floor, never clipping. WRITE-FREE WHEN NOT ENGAGED: a .stmt that already fits at base size
    // (measured against its authored line structure) gets zero style mutations. Structure mirrors
    // the carousel injector's runFit (incl. the resolved-max-width % fix + document.fonts.ready defer).
    var SCALE_STEP = 0.05, SOFT_FLOOR = 0.65, HARD_FLOOR = 0.5;

    function rectToPlain(r) {
      return { width: r.width, height: r.height, left: r.left, top: r.top, right: r.right, bottom: r.bottom };
    }

    // Measures the natural (unwrapped) width of each authored line via a temporary nowrap toggle,
    // bypassing any implicit flex-shrink-driven wrap — tells us whether the AUTHORED line structure
    // itself needs help, independent of what the browser might silently do on its own.
    function maxLineWidthNoWrap(stmtEl, lineNodes) {
      var had = stmtEl.style.whiteSpace;
      stmtEl.style.whiteSpace = 'nowrap';
      var max = 0;
      lineNodes.forEach(function (tn) {
        var r = document.createRange();
        r.selectNodeContents(tn);
        var rects = r.getClientRects();
        for (var i = 0; i < rects.length; i++) if (rects[i].width > max) max = rects[i].width;
      });
      if (had) stmtEl.style.whiteSpace = had; else stmtEl.style.removeProperty('white-space');
      return max;
    }

    function runFit() {
      window.__slotFitReport = window.__slotFitReport || {};
      built.forEach(function (item) {
        var stmtEl = item.stmt.el, lineNodes = item.stmt.lineNodes, containerEl = item.containerEl;
        var contCs = getComputedStyle(containerEl);
        var availableWidth = containerEl.clientWidth - parseFloat(contCs.paddingLeft) - parseFloat(contCs.paddingRight);
        var availableHeight = containerEl.clientHeight - parseFloat(contCs.paddingTop) - parseFloat(contCs.paddingBottom);
        var stmtCs = getComputedStyle(stmtEl);
        // getComputedStyle keeps max-width as a literal percentage string (e.g. "64%") rather than
        // resolving it to px — resolve it ourselves against the container's content-box width. A plain
        // px value (or "none") is used as-is.
        var maxWidthRaw = stmtCs.maxWidth;
        var cssMaxWidth = NaN;
        if (maxWidthRaw && maxWidthRaw !== 'none') {
          cssMaxWidth = maxWidthRaw.indexOf('%') !== -1
            ? (parseFloat(maxWidthRaw) / 100) * availableWidth
            : parseFloat(maxWidthRaw);
        }
        if (Number.isFinite(cssMaxWidth) && cssMaxWidth > 0 && cssMaxWidth < availableWidth) availableWidth = cssMaxWidth;

        var baseFontSizePx = parseFloat(stmtCs.fontSize);
        var authoredLineCount = lineNodes.length;
        var naturalMaxLineWidth = maxLineWidthNoWrap(stmtEl, lineNodes);
        var naturalLineHeightPx = parseFloat(getComputedStyle(stmtEl).lineHeight);
        var naturalTotalHeight = authoredLineCount * naturalLineHeightPx;

        if (naturalMaxLineWidth <= availableWidth + 0.5 && naturalTotalHeight <= availableHeight + 0.5) {
          // Already fits at base size — ZERO style mutations (write-free requirement).
          window.__slotFitReport[item.plate] = { scale: 1, rect: rectToPlain(stmtEl.getBoundingClientRect()) };
          return;
        }

        var scale = 1, fitted = false;

        // Phase A: shrink font in 5% steps to the 65% floor, preserving the authored line count (no
        // additional wrap) — re-measured at each step since font-size affects line width/height.
        for (var s = 0.95; s >= SOFT_FLOOR - 1e-9; s -= SCALE_STEP) {
          stmtEl.style.fontSize = (baseFontSizePx * s) + 'px';
          var lw = maxLineWidthNoWrap(stmtEl, lineNodes);
          var lh = parseFloat(getComputedStyle(stmtEl).lineHeight) * authoredLineCount;
          scale = s;
          if (lw <= availableWidth + 0.5 && lh <= availableHeight + 0.5) { fitted = true; break; }
        }

        if (!fitted) {
          // Phase B: allow natural wrap within the available width — keep reducing scale to the 50%
          // hard floor; never below it (accept the floor as final even if still tight).
          stmtEl.style.maxWidth = availableWidth + 'px';
          for (var s2 = SOFT_FLOOR; s2 >= HARD_FLOOR - 1e-9; s2 -= SCALE_STEP) {
            stmtEl.style.fontSize = (baseFontSizePx * s2) + 'px';
            var bx = stmtEl.getBoundingClientRect();
            var noHOverflow = stmtEl.scrollWidth <= stmtEl.clientWidth + 1;
            var withinH = bx.height <= availableHeight + 0.5;
            scale = s2;
            if (noHOverflow && withinH) { fitted = true; break; }
          }
          if (!fitted) {
            stmtEl.style.fontSize = (baseFontSizePx * HARD_FLOOR) + 'px';
            scale = HARD_FLOOR;
          }
        }

        window.__slotFitReport[item.plate] = { scale: scale, rect: rectToPlain(stmtEl.getBoundingClientRect()) };
      });
    }

    // Defer measurement until the web font has actually applied — measuring against a fallback
    // font's metrics would produce wrong scale decisions once Instrument Sans swaps in.
    // plate-capture.cjs already awaits document.fonts.ready before screenshotting, and this handler
    // is registered before that later await, so it is guaranteed to run first.
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(runFit);
    } else {
      runFit();
    }
  })();
</script>
<script>
  const only=new URLSearchParams(location.search).get('only');
  if(only){for(const el of document.querySelectorAll('[data-plate]')){el.style.visibility=(el.getAttribute('data-plate')===only)?'visible':'hidden';}}
</script>
