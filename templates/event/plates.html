<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<script>
  // Ratio switch: reads ?ratio= independently of the ?only= visibility toggle below. Unknown/absent
  // values leave the className empty — base (1x1) CSS is the untouched default. (Verbatim contract
  // from templates/new-hire/plates.html.)
  (function () {
    var ratio = new URLSearchParams(location.search).get('ratio');
    var known = { '4x5': 1, '9x16': 1, '16x9': 1 };
    document.documentElement.className = known[ratio] ? 'ratio-' + ratio : '';
  })();
</script>
<script>
  // Ground/ink flip (SLOT-02/SLOT-04) — runs AFTER the ratio script above and uses classList.add
  // (never a className assignment), so it can never clobber (or be clobbered by) the ratio script's
  // className assignment regardless of execution order. The event's base ground is CARBON (the
  // default, always present in the orchestrator's query as ground=carbon) → base state = light copy
  // on carbon, which adds NO class, so the default-ground round-trip stays byte-identical. ground=halo
  // flips copy to dark ink and auto-selects the Carbon-on-Halo lockup. The CTA stays Flarepop on BOTH
  // grounds (colored text is brand-legal on carbon — mirroring New Hire's .name). lockupInk overrides
  // the lockup ink explicitly regardless of ground.
  (function () {
    var params = new URLSearchParams(location.search);
    var g = params.get('ground');
    if (g === 'halo') document.documentElement.classList.add('ground-halo');
    var ink = params.get('lockupInk');
    if (ink === 'carbon' || ink === 'halo') document.documentElement.classList.add('lockup-ink-' + ink);
  })();
</script>
<title>Event / webinar — square plates</title>
<style>
  /* Local fonts (BLDR-03) — the shared Instrument Sans 500/600/700 display file (title + CTA) + Inter
     400/500/600/700 body file (date), the same woff2 New Hire embeds, no CDN/network dependency. Path
     is relative to this file's own directory (templates/event/), which is how plate-capture.cjs's
     file:// load resolves it. */
  @font-face{font-family:'Instrument Sans';font-style:normal;font-weight:500;font-display:swap;
    src:url('../../assets/fonts/instrument-sans-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Instrument Sans';font-style:normal;font-weight:600;font-display:swap;
    src:url('../../assets/fonts/instrument-sans-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Instrument Sans';font-style:normal;font-weight:700;font-display:swap;
    src:url('../../assets/fonts/instrument-sans-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;
    src:url('../../assets/fonts/inter-400-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;
    src:url('../../assets/fonts/inter-400-500-600-700.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;
    src:url('../../assets/fonts/inter-400-500-600-700.woff2') format('woff2');}
  :root{--flarepop-100:#ff00e5;--carbon-100:#3a3a4a;--carbon-500:#0a0a0f;--halo-100:#ffffff;
    --font-display:'Instrument Sans',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;}
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;width:1080px;height:1080px;overflow:hidden;background:transparent;}
  .frame{width:1080px;height:1080px;position:relative;overflow:hidden;background:transparent;}
  /* Top-anchored event card: lockup, then the headline, the date, the CTA — a clean top-down stack.
     Base ground is carbon, so base ink is light (Halo-on-Carbon); ground=halo flips to dark. */
  .content{position:absolute;inset:0;padding:96px;z-index:2;display:flex;flex-direction:column;height:100%;}
  .lockup{height:46px;aspect-ratio:4.25/1;align-self:flex-start;color:var(--halo-100);}
  .lockup svg{width:100%;height:100%;display:block;}
  .title{font-family:var(--font-display);font-weight:700;font-size:88px;line-height:0.98;
    letter-spacing:-0.035em;color:var(--halo-100);margin:96px 0 0;}
  .date{font-family:var(--font-body);font-weight:500;font-size:34px;line-height:1.3;
    color:#b9b9c6;margin:40px 0 0;}
  /* CTA — Flarepop-colored TEXT only. NO background-color / fill / pill (brand rule: the BRAND-GATE
     counts magenta fill area — a filled magenta CTA would FAIL it). Hierarchy is color + weight alone;
     no decorative rule line / divider / border. */
  .cta{font-family:var(--font-display);font-weight:700;font-size:46px;line-height:1.1;
    letter-spacing:-0.02em;color:var(--flarepop-100);margin:32px 0 0;}

  /* Ratio overrides (RATIO-02/03/04) — appended, base 1x1 CSS above untouched. Scoped by
     html.ratio-{r} (set by the head script from ?ratio=); higher specificity wins, so only the listed
     properties change per ratio. */

  /* 4x5 (1080x1350) — more vertical room; type grows. */
  html.ratio-4x5 body,html.ratio-4x5 .frame{width:1080px;height:1350px;}
  html.ratio-4x5 .content{padding:104px;}
  html.ratio-4x5 .lockup{height:50px;}
  html.ratio-4x5 .title{font-size:100px;margin:120px 0 0;}
  html.ratio-4x5 .date{font-size:38px;margin:48px 0 0;}
  html.ratio-4x5 .cta{font-size:50px;margin:36px 0 0;}

  /* 9x16 (1080x1920) — portrait; the biggest display treatment, more headroom. */
  html.ratio-9x16 body,html.ratio-9x16 .frame{width:1080px;height:1920px;}
  html.ratio-9x16 .content{padding:104px;}
  html.ratio-9x16 .lockup{height:50px;}
  html.ratio-9x16 .title{font-size:112px;margin:160px 0 0;}
  html.ratio-9x16 .date{font-size:40px;margin:56px 0 0;}
  html.ratio-9x16 .cta{font-size:52px;margin:40px 0 0;}

  /* 16x9 (1920x1080) — wide; copy reads as a LEFT block (constrained to ~58% width) so lines rewrap
     for the wide frame instead of stretching edge-to-edge. */
  html.ratio-16x9 body,html.ratio-16x9 .frame{width:1920px;height:1080px;}
  html.ratio-16x9 .content{padding:88px;width:60%;}
  html.ratio-16x9 .title{font-size:92px;max-width:96%;}
  html.ratio-16x9 .date{font-size:34px;}
  html.ratio-16x9 .cta{font-size:46px;}

  /* Ground ink flip + lockup ink override (SLOT-02/SLOT-04) — appended, base CSS above untouched.
     ground=halo (class added) flips copy to dark ink and the Carbon-on-Halo lockup. carbon/absent/
     unknown adds NO class → the default (light-on-carbon) round-trip stays byte-identical. .cta keeps
     its own untouched rule (Flarepop, colored text only, both grounds). lockupInk override rules come
     AFTER the ground rules so an explicit lockupInk always wins a specificity tie. The lockup stays the
     canonical 8-path centered symbol throughout — a CSS color swap only, zero path/markup changes. */
  html.ground-halo .title{color:var(--carbon-500);}
  html.ground-halo .date{color:var(--carbon-100);}
  html.ground-halo .lockup{color:var(--carbon-500);}
  html.lockup-ink-carbon .lockup{color:var(--carbon-500);}
  html.lockup-ink-halo .lockup{color:var(--halo-100);}
</style></head>

<div class="frame">
  <div class="content">
    <div class="lockup" data-plate="lockup"><svg><use href="#intercept-lockup-centered"/></svg></div>
    <h1 class="title" data-plate="title">Scaling brand<br>without the drift</h1>
    <p class="date" data-plate="date">Thursday, June 12 · 11am PT</p>
    <p class="cta" data-plate="cta">Register now →</p>
  </div>
</div>
<script>
  // Content injection (SLOT-01/SLOT-03) — reads ?content= (URL-encoded JSON; schema
  // { title, date, cta, ground?, lockupInk? }). ABSENT -> ZERO DOM writes, guaranteeing the no-param
  // placeholder path stays byte-identical. PRESENT -> fills title (a string that MAY contain \n for a
  // 2nd line, rebuilt via createTextNode/<br> only — never innerHTML, so copy is transcribed verbatim),
  // date, cta via textContent, then runs an overflow-fit pass (write-free when it already fits)
  // exposing window.__slotFitReport. capture-content-plates.cjs ALWAYS passes content=, so the default
  // spec routes through this exact rebuild — the \n-structured default title is precisely what this
  // reproduces byte-identically against the committed static markup.
  (function () {
    var raw = new URLSearchParams(location.search).get('content');
    if (!raw) return; // additive-optional: default (no-content) capture path is completely untouched
    var content;
    try { content = JSON.parse(decodeURIComponent(raw)); } catch (e) { return; }
    if (!content || typeof content !== 'object') return;

    // setText (Phase 14 universal LINE-RETURNS) — \n -> <br> for the plain-text date/cta slots. No \n
    // => el.textContent = str, BYTE-IDENTICAL to the previous assignment.
    function setText(el, str) {
      str = String(str);
      // Returns the per-\n-line text nodes (for the optional per-line color pass). The no-\n branch is
      // BYTE-IDENTICAL to the previous `el.textContent = str` assignment.
      if (str.indexOf('\n') === -1) { el.textContent = str; return [el.firstChild]; }
      while (el.firstChild) el.removeChild(el.firstChild);
      var nodes = [];
      str.split('\n').forEach(function (line, i) {
        if (i > 0) el.appendChild(document.createElement('br'));
        var tn = document.createTextNode(line);
        el.appendChild(tn);
        nodes.push(tn);
      });
      return nodes;
    }
    // applyTextControls (Phase 14 per-slot COLOR + SIZE) — content.colors[slot] is a resolved brand hex
    // (no hex literal in this file); content.sizeScales[slot] multiplies the slot's BASE font-size,
    // applied BEFORE runFit so size is a TARGET and the overflow auto-fit stays the safety clamp.
    // Absent => ZERO writes => byte-identical.
    function applyTextControls(map) {
      var colors = content.colors, sizes = content.sizeScales;
      // colorLine — color ONE \n-line. An Element (a word span / the Flarepop accent span) is colored
      // directly (an inline color beats the class, so a per-line color OVERRIDES the auto-accent); a bare
      // text node is wrapped in a fresh inline <span> so only that line is colored. No layout change, so
      // the overflow-fit pass (which measures the original text nodes) is unaffected.
      function colorLine(node, hex) {
        if (!node || !hex) return;
        if (node.nodeType === 1) { node.style.color = hex; return; }
        var parent = node.parentNode; if (!parent) return;
        var span = document.createElement('span');
        parent.insertBefore(span, node);
        span.appendChild(node);
        span.style.color = hex;
      }
      Object.keys(map).forEach(function (slot) {
        var t = map[slot];
        var c = colors ? colors[slot] : null;
        if (Array.isArray(c)) {
          // PER-LINE color (Phase 14 v1.2): c is an array of resolved brand hexes, ONE PER \n-line
          // (index 0 = first line). A shorter array / null entry leaves that line at its slot/template
          // default. Applied to every instance this slot rendered (e.g. each carousel beat). A line entry
          // may be a single node OR an array of nodes (e.g. a quote line's word spans).
          (t.lines || []).forEach(function (instance) {
            (instance || []).forEach(function (lineEntry, i) {
              var hex = c[i]; if (!hex) return;
              (Array.isArray(lineEntry) ? lineEntry : [lineEntry]).forEach(function (n) { colorLine(n, hex); });
            });
          });
        } else if (typeof c === 'string' && c) {
          (t.color || []).forEach(function (el) { if (el) el.style.color = c; });
        }
        if (sizes && typeof sizes[slot] === 'number' && isFinite(sizes[slot]) && sizes[slot] !== 1) {
          (t.size || []).forEach(function (el) {
            if (!el) return;
            var base = parseFloat(getComputedStyle(el).fontSize);
            if (isFinite(base)) el.style.fontSize = (base * sizes[slot]) + 'px';
          });
        }
      });
    }

    // ---- title: rebuild with \n -> <br> (createTextNode/appendChild only, never innerHTML) ----
    var titleEl = document.querySelector('[data-plate="title"]');
    var titleLineNodes = [];
    if (content.title != null) {
      while (titleEl.firstChild) titleEl.removeChild(titleEl.firstChild);
      var lines = String(content.title).split('\n');
      lines.forEach(function (line, i) {
        if (i > 0) titleEl.appendChild(document.createElement('br'));
        var tn = document.createTextNode(line);
        titleEl.appendChild(tn);
        titleLineNodes.push(tn);
      });
    }
    var dateEl = document.querySelector('[data-plate="date"]');
    var ctaEl = document.querySelector('[data-plate="cta"]');
    var dateLineNodes = content.date != null ? setText(dateEl, content.date) : null;
    var ctaLineNodes = content.cta != null ? setText(ctaEl, content.cta) : null;

    // title/date/cta -> their own elements. `lines` = each slot's authored \n-lines so a per-line colors
    // array colors each line independently. Applied before runFit so size is a target, fit clamps.
    applyTextControls({
      title: { color: [titleEl], size: [titleEl], lines: [titleLineNodes] },
      date: { color: [dateEl], size: [dateEl], lines: dateLineNodes ? [dateLineNodes] : [] },
      cta: { color: [ctaEl], size: [ctaEl], lines: ctaLineNodes ? [ctaLineNodes] : [] },
    });

    // ---- overflow fit (SLOT-01): scale-down-then-wrap, WRITE-FREE WHEN IT ALREADY FITS. Per-slot
    // single-line scale-down to a 65% soft floor (preferring to keep the authored line structure),
    // then — if the whole top-down stack still overflows the frame vertically (the CTA, the last
    // stacked slot, extends past the available bottom edge) — step every slot down together to a hard
    // 50% floor. Never clips (no overflow:hidden on a text slot) — correctness is asserted by the
    // verify script, not hidden. Mirrors new-hire's runFit (incl. the resolved-max-width % fix + the
    // document.fonts.ready deferral). ------------------------------------------------------------
    function runFit() {
      var frame = document.querySelector('.frame');
      var contentEl = document.querySelector('.content');
      var slotNames = ['title', 'date', 'cta'];
      var els = {}, baseSize = {}, scale = {};
      slotNames.forEach(function (name) {
        var el = document.querySelector('[data-plate="' + name + '"]');
        els[name] = el;
        baseSize[name] = parseFloat(getComputedStyle(el).fontSize);
        scale[name] = 1;
      });

      var contentRect = contentEl.getBoundingClientRect();
      var contentStyle = getComputedStyle(contentEl);
      var paddingLeft = parseFloat(contentStyle.paddingLeft) || 0;
      var paddingRight = parseFloat(contentStyle.paddingRight) || 0;
      var paddingBottom = parseFloat(contentStyle.paddingBottom) || 0;
      var columnWidth = contentRect.width - paddingLeft - paddingRight;

      // Resolve a slot's usable width, correctly handling a PERCENTAGE max-width (getComputedStyle
      // keeps it as a literal "%" string rather than resolving it to px — resolve against columnWidth).
      function boxWidth(el) {
        var raw = getComputedStyle(el).maxWidth;
        var mw = NaN;
        if (raw && raw !== 'none') {
          mw = raw.indexOf('%') !== -1 ? (parseFloat(raw) / 100) * columnWidth : parseFloat(raw);
        }
        return (Number.isFinite(mw) && mw > 0 && mw < columnWidth) ? mw : columnWidth;
      }

      // Widest authored line (an explicit <br> still breaks under white-space:nowrap, so scrollWidth of
      // the nowrap element === the widest authored line — exactly what we want to size against).
      function singleLineWidth(el) {
        var prev = el.style.whiteSpace;
        el.style.whiteSpace = 'nowrap';
        var w = el.scrollWidth;
        if (prev) { el.style.whiteSpace = prev; } else { el.style.removeProperty('white-space'); }
        return w;
      }

      function applyScale(name) {
        els[name].style.fontSize = (baseSize[name] * scale[name]) + 'px';
      }

      // Phase A: per-slot single-line scale-down, 5% steps, floor 65% of base — prefer keeping the
      // authored line structure before accepting wraps.
      var FLOOR_A = 0.65;
      slotNames.forEach(function (name) {
        var el = els[name];
        var box = boxWidth(el);
        while (singleLineWidth(el) > box && scale[name] > FLOOR_A + 1e-9) {
          scale[name] = Math.max(FLOOR_A, +(scale[name] - 0.05).toFixed(4));
          applyScale(name);
        }
      });

      // Phase B: at each slot's floor, natural wrapping is already allowed (block elements, no
      // white-space:nowrap left set). If the resulting stack still overflows the frame vertically (the
      // CTA — the last stacked slot — extends past the available bottom edge), step every slot down
      // together to a hard floor of 50%. Never clip.
      var FLOOR_B = 0.50;
      function stackOverflows() {
        var frameRect = frame.getBoundingClientRect();
        var ctaRect = els.cta.getBoundingClientRect();
        return ctaRect.bottom > (frameRect.bottom - paddingBottom);
      }
      var guard = 0;
      while (stackOverflows() && guard < 20) {
        var steppedAny = false;
        slotNames.forEach(function (name) {
          if (scale[name] > FLOOR_B + 1e-9) {
            scale[name] = Math.max(FLOOR_B, +(scale[name] - 0.05).toFixed(4));
            applyScale(name);
            steppedAny = true;
          }
        });
        if (!steppedAny) break;
        guard++;
      }

      window.__slotFitReport = {};
      slotNames.forEach(function (name) {
        var r = els[name].getBoundingClientRect();
        window.__slotFitReport[name] = { scale: scale[name], rect: { x: r.x, y: r.y, w: r.width, h: r.height } };
      });
    }

    // Defer measurement until the web font has actually applied — measuring against a fallback font's
    // metrics would produce wrong scale decisions once Instrument Sans/Inter swap in. plate-capture.cjs
    // already awaits document.fonts.ready before screenshotting, and this handler is registered before
    // that later await, so it is guaranteed to run first.
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(runFit);
    } else {
      runFit();
    }
  })();
</script>
<script>
  const only=new URLSearchParams(location.search).get('only');
  if(only){for(const el of document.querySelectorAll('[data-plate]')){el.style.visibility=(el.getAttribute('data-plate')===only)?'visible':'hidden';}}
</script>
</body></html>
