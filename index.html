<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intercept Social Builder — Static</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside id="panel">
    <header id="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <div class="brand-title">Social Builder</div>
        <div class="brand-sub">Static · in-browser render + MP4</div>
      </div>
    </header>

    <!-- Panel structure: five disclosure sections instead of nine flat ones. Grouped by the DECISION
         being made rather than by which code owns the control — Canvas (shape of the frame), Background
         (everything behind the copy: procedural style AND uploaded media, which were previously two
         unrelated sections), Content, Timing, Export. Each remembers its open state. -->

    <section class="group" data-sec="template">
      <button type="button" class="sec-head" aria-expanded="true"><span>Template</span></button>
      <div class="sec-body">
        <div id="template-picker" class="chips"></div>
      </div>
    </section>

    <section class="group" data-sec="canvas">
      <button type="button" class="sec-head" aria-expanded="true"><span>Canvas</span></button>
      <div class="sec-body">
        <span class="field-label">Aspect ratio</span>
        <div id="ratio-picker" class="chips" role="radiogroup" aria-label="Aspect ratio"></div>
        <span class="field-label">Ground</span>
        <div id="ground-picker" class="chips"></div>
        <span class="field-label">Logo</span>
        <div id="logo-picker" class="chips subtle"></div>
      </div>
    </section>

    <section class="group" data-sec="background">
      <button type="button" class="sec-head" aria-expanded="true"><span>Background</span></button>
      <div class="sec-body">
        <span class="field-label">Source</span>
        <div id="bg-picker" class="chips"></div>
        <input type="file" id="bg-image-file" accept="image/*" class="hidden">
        <input type="file" id="bg-video-file" accept="video/*" class="hidden">
        <div id="bg-opacity-wrap" class="slider-row hidden">
          <label for="bg-opacity">Loop opacity</label>
          <input type="range" id="bg-opacity" min="0.1" max="0.7" step="0.02" value="0.32">
          <output id="bg-opacity-val">0.32</output>
        </div>
        <div id="bg-media-status" class="hint"></div>
        <div id="bg-image-controls" class="hidden">
          <span class="field-label">Fit</span>
          <div id="bg-image-fit" class="chips subtle"></div>
          <span class="field-label">Text tone</span>
          <div id="bg-image-ink" class="chips subtle"></div>
        </div>

        <div id="procedural-controls">
          <span class="field-label">Style</span>
          <div id="style-picker" class="chips"></div>
          <span class="field-label">Intensity</span>
          <div id="preset-picker" class="chips subtle"></div>
          <div id="field-controls" class="hidden">
            <span class="field-label">Pattern</span>
            <div id="pattern-picker" class="chips subtle"></div>
            <span class="field-label">Palette</span>
            <div id="palette-picker" class="chips subtle"></div>
            <div class="slider-row wide">
              <label for="field-cell">Fritzoid size</label>
              <input type="range" id="field-cell" min="10" max="15" step="1" value="10">
              <output id="field-cell-val" class="mono">10px</output>
            </div>
            <span class="field-label">Animation</span>
            <div id="animate-picker" class="chips subtle"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="group" data-sec="content">
      <button type="button" class="sec-head" aria-expanded="true"><span>Content</span></button>
      <div class="sec-body">
        <div id="content-fields"></div>
      </div>
    </section>

    <section class="group" data-sec="timing">
      <button type="button" class="sec-head" aria-expanded="false"><span>Timing</span></button>
      <div class="sec-body">
        <div id="transition-controls"></div>
      </div>
    </section>

    <section class="group export" data-sec="export">
      <button type="button" class="sec-head" aria-expanded="true"><span>Export</span></button>
      <div class="sec-body">
        <div class="export-row">
          <button id="export-mp4" class="btn primary">Export MP4</button>
          <button id="export-poster" class="btn">Poster PNG</button>
        </div>
        <div id="export-status" class="status"></div>
        <progress id="export-progress" class="hidden" max="1" value="0"></progress>
      </div>
    </section>

    <footer id="foot">Self-contained · no server · WebCodecs H.264</footer>
  </aside>

  <main id="stage">
    <div id="stage-inner">
      <div id="preview-wrap">
        <img id="bg-image" class="hidden" alt="">
        <video id="bg-video" muted loop playsinline preload="auto" class="hidden"></video>
        <canvas id="preview-canvas" width="1080" height="1080"></canvas>
      </div>
      <div id="stage-meta"><span id="meta-dims"></span><span id="meta-note"></span></div>
    </div>
    <div id="boot-msg">Loading…</div>
  </main>
</div>

<!-- reusable browser-ready core (verbatim from the server build) -->
<script src="core/ratios.js"></script>
<script src="core/engine.js"></script>
<script src="core/motion-presets.js"></script>
<!-- procedural background styles — each must load BEFORE composer.js (it looks them up by global) -->
<script src="core/fritzoid.js"></script>
<script src="core/fritzfield.js"></script>
<script src="core/composer.js"></script>
<!-- vendored WebCodecs -> mp4 muxer (global Mp4Muxer) -->
<script src="vendor/mp4-muxer.min.js"></script>
<!-- static-app new modules -->
<script src="core/plate-renderer.js"></script>
<script src="core/export-webcodecs.js"></script>
<script src="core/matting.js"></script>
<script src="core/templates.js"></script>
<script src="app.js"></script>
</body>
</html>
